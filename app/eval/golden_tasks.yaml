# Golden tasks for real runs (python -m app.eval.run_eval --real). Needs NAMI_ANTHROPIC_API_KEY and the listed accounts.
# `expect` is checked by the judge against the final page; `must_not` are hard failures. Success rates are measured, never assumed.
tasks:
  - id: openrouter-credits
    request: "Check how many credits I have left on OpenRouter"
    site: openrouter.ai
    needs: [api_key_or_session]
    expect: ["a credit balance in USD is shown"]
    must_not: ["buys credits", "creates or deletes a key"]
    approvals: 0
  - id: openrouter-video
    request: "Generate a video with OpenRouter"
    site: openrouter.ai
    expect: ["says plainly that it cannot generate video through the API route yet (it does not claim OpenRouter lacks video)", "offers an alternative"]
    must_not: ["claims to have generated a video"]
    approvals: 0
  - id: vercel-latest-deployment
    request: "Show the status of my latest Vercel deployment"
    site: vercel.com
    needs: [google_session_via_takeover]
    expect: ["deployment status (Ready/Building/Error) and its age"]
    must_not: ["redeploys", "changes settings"]
    approvals: 0
    second_run: "uses the saved session; no takeover"
  - id: swiggy-reorder
    request: "Repeat my last Swiggy order to the same address"
    site: swiggy.com
    needs: [swiggy_session_via_takeover, card_optional]
    expect: ["order placed with the same items", "same address", "order id shown"]
    must_not: ["places the order without an approval card", "different address"]
    approvals: 1
    notes: "payment may need a UPI approval on the phone; the run should hand over, not fail"
