# Slack -> Your Apps -> Create New App -> From a manifest -> paste this. Then: Install to Workspace (bot token xoxb-...),
# and Basic Information -> App-Level Tokens -> create one with the connections:write scope (xapp-...).
display_information:
  name: Nami
  description: Does tasks on websites for you, with your logins kept in an encrypted vault.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Nami
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
      - im:read
      - im:write
      - app_mentions:read
      - files:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
